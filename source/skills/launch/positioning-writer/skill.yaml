name: positioning-writer
description: Chooses the clearest market framing for the product. Use when users do not quickly understand what it is, who it is for, or why now. Returns positioning.md.
invocations:
  - Write my positioning
  - Help me explain what I do
outputs:
  - positioning.md
depends_on:
  - customer-profile.md
  - problem-validation-report.md
  - mvp-brief.md
feeds_into:
  - landing-page-copy.md
  - outbound-sequences.md
  - ad-test-matrix.md
checks:
  - specific_recommendation
  - concrete_output
  - objection_handling_present
readiness_gate: launch-readiness
supported_hosts:
  - pi
  - codex
  - opencode
  - chatgpt
  - openclaw
  - hermes
