name: focus-planner
description: Locks the single highest-leverage focus for the next work cycle. Use when priorities are scattered, momentum is noisy, or a review needs a decision. Returns focus-plan.md.
invocations:
  - Help me focus
  - Plan next week's focus
outputs:
  - focus-plan.md
checks:
  - one_focus_present
  - tradeoffs_present
supported_hosts:
