name: experiment-planner
description: Turns a bottleneck or risky belief into one measurable experiment. Use when you know what must be learned next but not how to test it. Returns experiment-plan.md.
invocations:
  - Plan my next experiment
  - Turn this into an experiment
outputs:
  - experiment-plan.md
checks:
  - experiment_present
  - success_metric_present
supported_hosts:
  - pi
  - codex
  - opencode
  - chatgpt
  - openclaw
  - hermes
