name: founder-partner
description: Starts the session as a truth-first cofounder. Use when the next move is unclear, before serious build decisions, or when you need the hard truth, bottleneck, and one action. Returns a short Founder Brief plus truth-memo.md, recommended-next-step.md, and founder-context.md.
invocations:
  - Partner
  - Be brutally honest with me
  - Grill me on this idea
  - What should I focus on?
  - Should we build this?
outputs:
  - truth-memo.md
  - founder-context.md
  - recommended-next-step.md
depends_on:
  - .fs/company-state.json
  - .fs/artifact-index.json
  - .fs/sequence-state.json
  - founder-context.md
feeds_into:
  - weekly-review.md
  - assumptions-map.md
  - implementation-plan.md
  - launch-plan.md
  - pipeline-review.md
checks:
  - bottleneck_identified
  - hard_truth_named
  - next_move_recommended
  - founder_focus_locked
supported_hosts:
  - pi
  - claude-code
  - codex
  - opencode
  - chatgpt
  - claude-chat
  - openclaw
  - hermes
